description: Digeguigui MCP is a comprehensive reptile and exotic pet knowledge server. Provides AI species identification (633 species, 368 turtles), genetics calculator (Punnett square), health diagnosis for common reptile diseases, 12-dimension care parameters, market pricing (CNY), and blockchain-anchored provenance verification. Free tier: 9 tools, instant API key, 10 req/min.
skills:
  - AI photo identification of reptiles (turtles, snakes, lizards, frogs, geckos)
  - Genetics and morph breeding calculator (Punnett square)
  - Reptile health symptom diagnosis with treatment recommendations
  - Species search by traits (difficulty, temperature, size, diet)
  - Market value estimation with morph/gene premium analysis
  - Blockchain provenance verification for pet certificates
  - Pet care guide with 12-dimension parameter comparison
