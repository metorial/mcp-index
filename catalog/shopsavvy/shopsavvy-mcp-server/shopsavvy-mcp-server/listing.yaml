description: Complete product and pricing data solution for AI assistants. Search for products by barcode/ASIN/URL, access detailed product metadata, access comprehensive pricing data from thousands of retailers, view and track price history, and more. Published as @shopsavvy/mcp-server.
skills:
  - Search products by barcode, ASIN, or URL
  - Access detailed product metadata and specifications
  - Get comprehensive pricing data from thousands of retailers
  - View and track historical price changes
  - Set up automated price monitoring and alerts
  - Analyze product reviews and ratings
  - Compare products and pricing across retailers